<div id="main_container_front">
    <div id="word_audio">{{Audio}}</div>
    <div>
        <button id="front_expr_button" class="button"><span id="front_expr">{{Expression}}</span></button>
    </div>
    <div id="hint_container">
        <div id="front_furigana">{{Furigana}}</div>
        <button id="hint_button" class="button">Reveal furigana</button>
    </div>
</div>

<script>        
    (() => {
        if (!window.__ankiCardState) {
            window.__ankiCardState = {
                timer: null
            };
        }
        const state = window.__ankiCardState;

        function inject() {
            document.getElementById("front_furigana").style.display = "block";
            document.getElementById("hint_button").style.display = "none";
        }
    
        function play_audio() {
            document.querySelector("#word_audio > audio").play();
        }
        
        function revealFurigana() {
            const expr = document.getElementById("front_expr").textContent
            const furi = document.getElementById("front_furigana").textContent
            if (expr.match(/【[^】]+】/) === null && furi != expr){
                const hintbutton = document.getElementById("hint_button")        
                hintbutton.onclick = inject;
                hintbutton.style.opacity = 100;
                hintbutton.style.pointerEvents = "auto";
            }
        }
        
        function resetCard() {
            document.getElementById("front_furigana").style.display = "none"
            document.getElementById("front_expr_button").onclick = null
            document.getElementById("front_expr_button").onclick = play_audio
            
            const hintbutton = document.getElementById("hint_button")        
            hintbutton.style.opacity = "0";
            hintbutton.style.pointerEvents = "none";
            hintbutton.onclick = null;
        }
    
    
        function hasAudio(){
            const expr_button = document.getElementById("front_expr_button")
            expr_button.classList.remove("noAudio");
            const audio_source = document.querySelector("#word_audio > audio").getAttribute("src")
            if (audio_source == "%22%22"){
                expr_button.disabled = true;
                expr_button.classList.add("noAudio");
            }
        }
    
        
    
        function resetTimers() {
            if (state.timer) {
                clearTimeout(state.timer);
                state.timer = null;
            }
        }
    
        function startTimer() {
            resetTimers()
            if (SHOW_FURIGANA_TIMEOUT == -1000) {
                inject()
                return
            }
            state.timer = setTimeout(revealFurigana, SHOW_FURIGANA_TIMEOUT)
        }
        function initCard() {
            hasAudio()
            resetCard()
            startTimer()
        }
        if (!window.__ankiCardInitialized) {
            window.__ankiCardInitialized = true;
        }
        setTimeout(initCard, 0);
    })()
</script>
